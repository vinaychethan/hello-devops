name: CI-CD Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: hello-devops
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  build:
    name: Build
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci


  test:
    name: Test
    runs-on: self-hosted
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test


  artifact:
    name: Create Artifact
    runs-on: self-hosted
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify files
        run: ls -R

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-artifact
          path: |
            index.js
            package.json
            package-lock.json
            test/


  docker:
    name: Docker Build & Push
    runs-on: self-hosted
    needs: artifact

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-artifact
          path: .

      - name: Checkout Dockerfile
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest


  deploy:
    name: Deploy to Kubernetes
    runs-on: self-hosted
    needs: docker

    steps:
      - name: Checkout manifests
        uses: actions/checkout@v4

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/
          kubectl set image deployment/hello-devops \
            hello-devops=${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest -n default
          kubectl rollout status deployment/hello-devops -n default

      - name: Verify deployment
        run: |
          kubectl get pods -n default
          kubectl get svc -n default
